<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess AI - Chơi cờ vua với bot</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>♟️ Chess AI</h1>
      <p class="subtitle">Bạn chơi quân trắng, bot sẽ tự động đi quân đen.</p>

      <section class="game-area">
        <div id="board" class="board"></div>

        <aside class="panel">
          <h2>Điều khiển</h2>
          <button id="new-game">Ván mới</button>
          <button id="undo-move">Hoàn tác nước đi</button>

          <h3>Trạng thái</h3>
          <p id="status">Sẵn sàng bắt đầu.</p>

          <h3>Lịch sử nước đi</h3>
          <ol id="move-history"></ol>
        </aside>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
